name: lab-management

services:
  # ============================================================
  # PHP-FPM — aplikasi Laravel utama
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${APP_TARGET:-development}
      args:
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
      secrets:
        - vite_reverb_app_key
    image: lab-management-app:${APP_TARGET:-development}
    container_name: lab_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - lab_vendor:/var/www/html/vendor
      - lab_node_modules:/var/www/html/node_modules
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    networks:
      - network

  # ============================================================
  # Vite dev server — hot reload untuk resources/js & resources/css
  # ============================================================
  vite:
    image: node:20-alpine
    container_name: lab_vite
    working_dir: /app
    # npm install (bukan npm ci) — sama seperti fix di EduZone: npm ci gagal
    # kalau package-lock.json belum sinkron persis sama package.json.
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
    networks:
      - network

  # ============================================================
  # Nginx — reverse proxy ke php-fpm, serve asset public/
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: lab_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - network

  # ============================================================
  # Queue worker — Laravel Horizon
  # ============================================================
  queue:
    image: lab-management-app:${APP_TARGET:-development}
    container_name: lab_queue
    restart: unless-stopped
    depends_on:
      - app
    command: php artisan horizon
    volumes:
      - .:/var/www/html
      - lab_vendor:/var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    networks:
      - network

  # ============================================================
  # Reverb — WebSocket server. Container terpisah dari Reverb
  # milik EduZone (nama beda: lab_reverb, port beda: 8084) karena
  # Reverb terikat ke SATU instalasi Laravel spesifik, nggak bisa
  # digabung/dipakai bareng dua project berbeda.
  # ============================================================
  reverb:
    build:
      context: ./docker/reverb
      dockerfile: Dockerfile
    image: lab-management-reverb:latest
    container_name: lab_reverb
    restart: unless-stopped
    command: >
      php artisan reverb:start
      --host=0.0.0.0
      --port=${REVERB_PORT:-8084}
      --no-interaction
    volumes:
      - .:/var/www/html:ro
      - lab_vendor:/var/www/html/vendor:ro
    ports:
      - "${REVERB_PORT:-8084}:${REVERB_PORT:-8084}"
    depends_on:
      - app
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    networks:
      - network

volumes:
  lab_vendor:
    name: lab_vendor
  lab_node_modules:
    name: lab_node_modules

secrets:
  vite_reverb_app_key:
    file: ./secrets/vite_reverb_app_key.txt

networks:
  # Network shared dengan infrastructure (postgres, redis, reverb, dst) DAN dengan
  # EduZone — satu network yang sama dipakai bareng semua project di komputer ini.
  network:
    name: network
    external: true
