; ================================
; PHP Development Config
; ================================

[PHP]
; Error reporting - verbose untuk dev
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /var/log/php/error.log

; Memory & limits
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
post_max_size = 50M
upload_max_filesize = 50M
max_file_uploads = 20

; Timezone
date.timezone = Asia/Jakarta

; Session
session.gc_maxlifetime = 7200

; OPcache - DISABLE di dev agar perubahan langsung terlihat
[opcache]
opcache.enable = 0
opcache.enable_cli = 0