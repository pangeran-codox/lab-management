; ================================
; PHP Production Config - Optimized
; ================================

[PHP]
; Error reporting - sembunyikan dari user
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log

; Memory & limits
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
post_max_size = 50M
upload_max_filesize = 50M
max_file_uploads = 20

; Security
expose_php = Off

; Timezone
date.timezone = Asia/Jakarta

; Session
session.cookie_httponly = On
session.cookie_secure = On
session.gc_maxlifetime = 7200
session.use_strict_mode = On

; Realpath cache (performa filesystem)
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; ================================
; OPcache - AKTIF & Dioptimasi
; ================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0        ; 0 = tidak cek perubahan file (max performance)
opcache.validate_timestamps = 0    ; 0 = trust cache sepenuhnya
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.jit = 1255                 ; JIT enabled (PHP 8+)
opcache.jit_buffer_size = 128M