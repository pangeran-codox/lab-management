server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Upload limit — harus >= post_max_size di php-prod.ini (20M)
    # Diset 25M untuk memberi sedikit ruang di atas batas PHP
    client_max_body_size 25M;

    # ── Docker embedded DNS resolver ──────────────────────────────
    # WAJIB supaya nginx re-resolve tasks.lab_app / lab_reverb secara
    # berkala, bukan cache sekali di startup. Tanpa ini, kalau container
    # backend di-reschedule (IP baru), nginx tetap connect ke IP lama
    # sampai nginx-nya sendiri di-restart manual.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── Gzip compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/x-component
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-font-opentype
        application/x-font-truetype
        image/svg+xml
        image/x-icon
        font/opentype
        font/ttf
        font/woff
        font/woff2;

    # ── Routes ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Vite build assets ─────────────────────────────────────────
    location ^~ /build/ {
        expires max;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # ── Static assets ─────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|webp|woff|woff2|ttf|otf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # ── Proxy Reverb WebSocket ────────────────────────────────────
    location /app {
        set $reverb_upstream lab_reverb;
        proxy_pass http://$reverb_upstream:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── PHP-FPM (Load Balanced di Swarm) ─────────────────────────
    location ~ \.php$ {
        # ⚠️ Pakai variable supaya `resolver` di atas aktif dan
        # nginx re-resolve tasks.lab_app tiap 10 detik (bukan cache selamanya)
        set $php_upstream tasks.lab_app;
        fastcgi_pass $php_upstream:9000;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 5s;

        # Buffer FastCGI response
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ── Blokir akses file tersembunyi ─────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
