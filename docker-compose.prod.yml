name: lab-management-prod

services:

  # ─────────────────────────────
  # PHP Laravel App
  # ─────────────────────────────
  app:
    build:
      context: .
      target: production
    image: lab-management:latest
    container_name: lab_app
    restart: always
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lab_network

  # ─────────────────────────────
  # Nginx
  # ─────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lab_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro          # static files langsung dari host
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - lab_network

  # ─────────────────────────────
  # PostgreSQL
  # ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lab_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab_network
    # Tidak expose port ke luar di production!

  # ─────────────────────────────
  # Redis
  # ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lab_redis
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab_network

  # ─────────────────────────────
  # Queue Worker
  # ─────────────────────────────
  queue:
    image: lab-management:latest
    container_name: lab_queue
    restart: always
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --queue=default,notifications
    depends_on:
      - app
      - redis
    networks:
      - lab_network

  # ─────────────────────────────
  # Scheduler (Laravel Cron)
  # ─────────────────────────────
  scheduler:
    image: lab-management:latest
    container_name: lab_scheduler
    restart: always
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      - app
    networks:
      - lab_network

volumes:
  postgres_data:
  redis_data:
  certbot_www:
  certbot_certs:

networks:
  lab_network:
    driver: bridge