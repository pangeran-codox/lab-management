name: lab-management-dev

services:

  # ─────────────────────────────
  # PHP Laravel App
  # ─────────────────────────────
  app:
    build:
      context: .
      target: development
    container_name: lab_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lab_network

  # ─────────────────────────────
  # Nginx
  # ─────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lab_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - lab_network

  # ─────────────────────────────
  # PostgreSQL
  # ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret123
      POSTGRES_MULTIPLE_DATABASES: lab_management,finance
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lab_network

  # ─────────────────────────────
  # Redis
  # ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lab_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lab_network

  # ─────────────────────────────
  # Adminer (pengganti PhpMyAdmin, support PostgreSQL)
  # ─────────────────────────────
  adminer:
    image: adminer:latest
    container_name: lab_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      - postgres
    networks:
      - lab_network

  # ─────────────────────────────
  # Queue Worker
  # ─────────────────────────────
  queue:
    build:
      context: .
      target: development
    container_name: lab_queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - app
      - redis
    networks:
      - lab_network

  # ─────────────────────────────
  # Vite Dev Server (HMR)
  # ─────────────────────────────
  vite:
    image: node:20-alpine
    container_name: lab_vite
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - lab_network

  # ─────────────────────────────
  # Laravel Reverb - WebSocket
  # ─────────────────────────────
  reverb:
    build:
      context: .
      target: development
    container_name: lab_reverb
    restart: unless-stopped
    command: >
      php artisan reverb:start
      --host=0.0.0.0
      --port=8082
      --no-interaction
    volumes:
      - .:/var/www/html:ro
      - /var/www/html/vendor:ro
    ports:
      - "8082:8082"
    depends_on:
      - app
      - redis
    environment:
      APP_ENV: local
      APP_DEBUG: true
    networks:
      - lab_network

volumes:
  postgres_data:

networks:
  lab_network:
    driver: bridge